name: Report a problem
description: A conversion failed, the result looks wrong, or something on the site is broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You can write in **any language**.

        > **This issue will be public.** Don't include names, phone numbers, account details or other personal information.
        > If the problem needs a particular file: remove anything private before attaching it, describe the file instead, or email it to **convertubenet@outlook.com** with this issue's number in the subject.

  - type: input
    id: tool
    attributes:
      label: Which converter or page?
      description: The page address is the most useful answer.
      placeholder: https://convertube.net/pdf-to-word
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      placeholder: |
        I converted a 3-page PDF with two tables. The tables came out as plain text.
        I expected editable Word tables.
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: About the file
      description: Type, size, and where it came from (scanned, exported from Excel, recorded on an iPhone…). Attach it only if it has nothing private in it.
      placeholder: PDF, 2 MB, exported from Excel 2021

  - type: textarea
    id: error
    attributes:
      label: Error details
      description: If the site showed an error panel, paste its text here.
      render: text

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Windows 11 / Safari on iPhone 15

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I understand this issue is public, and it contains no personal information.
          required: true
